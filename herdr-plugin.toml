id = "beads.popover"
name = "Beads Popover"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Ctrl-click a bead ID in any pane to see its details without leaving the pane."
platforms = ["linux", "macos"]

[[actions]]
id = "show-bead"
title = "Show bead details"
contexts = ["pane", "workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/show-bead.sh\""]

[[panes]]
id = "detail"
title = "Bead"
# Split, not popup: Herdr does not route Ctrl-clicks originating inside a plugin
# popup, so bead IDs rendered in one are dead links. Walking a dependency tree
# means clicking IDs inside this pane, so it has to be an ordinary pane.
placement = "split"
# The path must be absolute. The action passes --cwd so bd can find its
# database, which means a relative "scripts/detail.sh" resolves against the
# clicked pane's directory instead and the pane dies immediately.
#
# env has to come first: bash prints a setlocale warning at startup when it
# inherits macOS's locale, before any command inside -c can fix it, and the
# warning lands in the pane as noise.
command = ["env", "LC_ALL=en_US.UTF-8", "bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/detail.sh\""]

[[link_handlers]]
id = "bead"
title = "Show bead details"
pattern = "^https?://bead\\.invalid/([A-Za-z][A-Za-z0-9_]*(-[A-Za-z0-9_]+)*-[A-Za-z0-9_.]+)/?$"
action = "show-bead"
